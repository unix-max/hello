[package]
name = "hello"
version = "0.1.0"
edition = "2024"

[dependencies]

[profile.release]
opt-level = "z"        # Оптимизация по размеру (можно попробовать "s" или "z", где "z" сильнее сжимает)
lto = true             # Link-Time Optimization (оптимизация на этапе линковки)
codegen-units = 1      # Уменьшает число модулей генерации кода для лучшей оптимизации (но увеличивает время сборки)
panic = "abort"        # Убирает код раскрутки стека при панике (panic unwinding)
strip = true           # Удаляет отладочные символы и секции (доступно в новых версиях Rust)